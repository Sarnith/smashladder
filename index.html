<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smash Ladder</title>
<script>
// Theme is chosen per device (Profile → Theme). Applied before first paint so the page doesn't flash.
(function(){
var t='court',m='system';
try{t=localStorage.getItem('smash_theme')||t;m=localStorage.getItem('smash_mode')||m;}catch(e){}
var d=document.documentElement;
d.dataset.theme=t;
d.dataset.mode=m==='system'?(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'):m;
})();
</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap');
/* Themes: data-theme picks the palette, data-mode picks light/dark (see applyTheme).
   Roles: bg page · card/court-mid surfaces · court-line subtle fill · accent brand colour ·
   on-accent text on accent fills · up/red climbed-won/dropped-lost · gold/silver/bronze medals. */
:root,[data-theme="court"][data-mode="dark"]{
--bg:#0d1f0f;--card:#162019;--court-mid:#142918;--court-line:#1e3d22;--border:#243d27;
--text:#e8f5e9;--muted:#7f9884;--accent:#4ade80;--accent-dim:#22c55e33;--on-accent:#0b2414;
--up:#4ade80;--up-dim:#22c55e33;--red:#f87171;--red-dim:#f8717122;--yellow:#fbbf24;
--gold:#fbbf24;--silver:#94a3b8;--bronze:#d97706;--overlay:rgba(0,0,0,.75);--shadow:rgba(0,0,0,.42);--grid:.25;
}
[data-theme="court"][data-mode="light"]{
--bg:#eef4ee;--card:#ffffff;--court-mid:#f4f8f3;--court-line:#dcebdd;--border:#d3e0d4;
--text:#12261a;--muted:#5d7263;--accent:#15803d;--accent-dim:#15803d1f;--on-accent:#ffffff;
--up:#15803d;--up-dim:#dcf3e2;--red:#b42318;--red-dim:#fbe1e1;--yellow:#a16207;
--gold:#b7860b;--silver:#64748b;--bronze:#b45309;--overlay:rgba(18,38,26,.45);--shadow:rgba(18,38,26,.14);--grid:.6;
}
[data-theme="night"][data-mode="dark"]{
--bg:#0b1220;--card:#121c30;--court-mid:#0f182a;--court-line:#1c2944;--border:#22304d;
--text:#e8edf7;--muted:#8391ad;--accent:#d4f542;--accent-dim:#d4f54226;--on-accent:#1a2305;
--up:#5fe0a8;--up-dim:#5fe0a826;--red:#f58ca0;--red-dim:#f58ca022;--yellow:#fbbf24;
--gold:#fbbf24;--silver:#a5b4cf;--bronze:#e08a4a;--overlay:rgba(2,6,14,.78);--shadow:rgba(0,0,0,.5);--grid:.25;
}
[data-theme="night"][data-mode="light"]{
--bg:#eef2f9;--card:#ffffff;--court-mid:#f5f7fc;--court-line:#e1e8f5;--border:#d6deec;
--text:#101a2e;--muted:#5b6680;--accent:#1d3a8a;--accent-dim:#1d3a8a1a;--on-accent:#ffffff;
--up:#0f7a50;--up-dim:#d9f2e6;--red:#b4233f;--red-dim:#fbe1e6;--yellow:#a16207;
--gold:#b7860b;--silver:#64748b;--bronze:#b45309;--overlay:rgba(16,26,46,.45);--shadow:rgba(16,26,46,.14);--grid:.6;
}
[data-theme="indigo"][data-mode="dark"]{
--bg:#12111b;--card:#1b1a29;--court-mid:#171624;--court-line:#26243b;--border:#2d2b45;
--text:#ebe9f7;--muted:#8f8baa;--accent:#a99bff;--accent-dim:#8b7cf62e;--on-accent:#150f33;
--up:#6ee7a5;--up-dim:#6ee7a526;--red:#f59090;--red-dim:#f5909022;--yellow:#fbbf24;
--gold:#fbbf24;--silver:#a8b1c7;--bronze:#e08a4a;--overlay:rgba(5,4,12,.78);--shadow:rgba(0,0,0,.5);--grid:.25;
}
[data-theme="indigo"][data-mode="light"]{
--bg:#f2f1f9;--card:#ffffff;--court-mid:#f7f6fc;--court-line:#e7e4f7;--border:#e0ddef;
--text:#17152b;--muted:#63607d;--accent:#5b47d6;--accent-dim:#5b47d61a;--on-accent:#ffffff;
--up:#15803d;--up-dim:#dcf3e5;--red:#b42318;--red-dim:#fbe1e1;--yellow:#a16207;
--gold:#b7860b;--silver:#64748b;--bronze:#b45309;--overlay:rgba(23,21,43,.45);--shadow:rgba(23,21,43,.14);--grid:.6;
}
[data-theme="clay"][data-mode="dark"]{
--bg:#19130f;--card:#241b16;--court-mid:#1f1813;--court-line:#33261e;--border:#3a2b22;
--text:#f5ebe3;--muted:#a8937f;--accent:#f08a4b;--accent-dim:#e8743a2e;--on-accent:#2a1206;
--up:#78e09a;--up-dim:#78e09a24;--red:#f5968c;--red-dim:#f5968c22;--yellow:#fbbf24;
--gold:#f5c542;--silver:#b8b2aa;--bronze:#d9864f;--overlay:rgba(10,6,3,.78);--shadow:rgba(0,0,0,.5);--grid:.25;
}
[data-theme="clay"][data-mode="light"]{
--bg:#f7f0e8;--card:#ffffff;--court-mid:#fbf7f2;--court-line:#f1e4d6;--border:#ecdfd3;
--text:#2a1c14;--muted:#7a6557;--accent:#b8501c;--accent-dim:#b8501c1a;--on-accent:#ffffff;
--up:#1d6b35;--up-dim:#dcf0e0;--red:#b42318;--red-dim:#fbe0dc;--yellow:#a16207;
--gold:#b7860b;--silver:#6b7280;--bronze:#9a3412;--overlay:rgba(42,28,20,.45);--shadow:rgba(42,28,20,.14);--grid:.6;
}
[data-mode="dark"]{color-scheme:dark;}
[data-mode="light"]{color-scheme:light;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Space Grotesk',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
body::before{content:'';position:fixed;inset:0;
background-image:linear-gradient(to right,var(--court-line) 1px,transparent 1px),linear-gradient(to bottom,var(--court-line) 1px,transparent 1px);
background-size:60px 60px;opacity:var(--grid);pointer-events:none;z-index:0;}
.wrap{position:relative;z-index:1;max-width:880px;margin:0 auto;padding:0 14px 60px;}
header{padding:24px 0 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
.logo-text{font-family:'Space Mono',monospace;font-size:20px;font-weight:700;color:var(--accent);}
.logo-sub{font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;}
.session-btn{background:var(--accent);color:var(--on-accent);border:none;padding:10px 16px;border-radius:8px;font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:700;cursor:pointer;}
.tabs{display:flex;gap:3px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:3px;margin-bottom:20px;overflow-x:auto;}
.tab{flex:1 0 auto;padding:8px 10px;border:none;background:transparent;color:var(--muted);font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:600;border-radius:7px;cursor:pointer;text-align:center;white-space:nowrap;}
.tab.active{background:var(--court-line);color:var(--accent);}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:8px;position:relative;overflow:hidden;}
.card-accent{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--border);}
.card-accent.gold{background:var(--gold);}
.card-accent.silver{background:var(--silver);}
.card-accent.bronze{background:var(--bronze);}
.player-row{display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:10px;}
.rank-num{font-family:'Space Mono',monospace;font-size:20px;font-weight:700;color:var(--muted);text-align:center;}
.rank-gold .rank-num{color:var(--gold);}
.rank-silver .rank-num{color:var(--silver);}
.rank-bronze .rank-num{color:var(--bronze);}
.player-name{font-size:15px;font-weight:600;}
.player-stats{font-size:11px;color:var(--muted);margin-top:2px;}
.delta{font-family:'Space Mono',monospace;font-size:12px;font-weight:700;}
.delta-up{color:var(--up);}
.delta-down{color:var(--red);}
.delta-none{color:var(--muted);}
/* Ladder history: rank after each of the last 5 sessions as columns */
.ladder-row{gap:4px 6px;}
.ladder-head{display:grid;gap:4px 6px;align-items:end;padding:0 16px 6px;}
.lh-date{font-family:'Space Mono',monospace;font-size:9px;color:var(--muted);text-align:center;line-height:1.2;}
.lh-tip{position:fixed;z-index:150;display:none;max-width:240px;background:var(--text);color:var(--bg);font-size:12px;line-height:1.5;padding:7px 10px;border-radius:8px;box-shadow:0 8px 24px var(--shadow);pointer-events:none;}
.lh-tip-title{font-weight:700;}
.lh-cell:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
.lh-cell{display:inline-flex;align-items:center;justify-content:center;width:30px;height:26px;border-radius:6px;border:1px solid transparent;background:var(--court-mid);color:var(--muted);font-family:'Space Mono',monospace;font-size:12px;font-weight:700;cursor:pointer;}
.lh-cell.up{background:var(--up-dim);color:var(--up);}
.lh-cell.down{background:var(--red-dim);color:var(--red);}
.lh-cell.absent{border:1px dashed var(--muted);}
.lh-cell.none{background:transparent;}
.lh-legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:11px;color:var(--muted);margin-top:10px;line-height:1.6;}
.lh-legend .lh-cell{width:22px;height:20px;font-size:10px;cursor:default;}
/* Share link row (Members tab) */
.share-row{display:flex;gap:8px;margin-top:12px;}
.share-row .add-input{flex:1;min-width:0;font-family:'Space Mono',monospace;font-size:12px;}
/* Theme picker (Profile → Theme) */
.theme-mode{display:flex;gap:6px;padding:4px 4px 10px;}
.theme-mode .score-opt{flex:1;padding:7px 6px;}
.theme-swatch{width:22px;height:22px;border-radius:50%;border:1px solid var(--border);flex-shrink:0;}
/* Remove button */
.rank-edit-input{
width:42px;height:42px;text-align:center;
background:var(--court-mid);border:1px solid var(--border);border-radius:8px;
color:var(--muted);font-family:'Space Mono',monospace;font-size:18px;font-weight:700;
outline:none;cursor:pointer;flex-shrink:0;
}
.rank-edit-input:focus{border-color:var(--accent);color:var(--accent);}
.remove-btn{background:transparent;border:1px solid var(--red);color:var(--red);width:30px;height:30px;border-radius:6px;cursor:pointer;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.remove-btn:hover{background:var(--red-dim);}
/* Two-step (type to confirm) dialog for destructive actions */
.danger-impact{background:var(--red-dim);border:1px solid color-mix(in srgb,var(--red) 40%,transparent);border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.55;color:var(--text);margin-bottom:6px;}
.danger-word{font-family:'Space Mono',monospace;color:var(--red);}
/* Rarely-used session actions, tucked away from the main button */
.more-menu{margin-top:16px;border-top:1px solid var(--border);padding-top:10px;}
.more-menu summary{list-style:none;cursor:pointer;font-size:12px;color:var(--muted);user-select:none;}
.more-menu summary::-webkit-details-marker{display:none;}
.more-menu-body{display:flex;flex-direction:column;align-items:flex-start;gap:8px;margin-top:10px;}
.more-menu-hint{font-size:11px;color:var(--muted);line-height:1.5;max-width:420px;}
/* Finished rounds, summarised under the current round */
.round-summary{padding:12px 14px;}
.round-summary-title{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.5px;margin-bottom:4px;}
.round-summary-court{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin:10px 0 2px;}
.round-games{margin-top:10px;border-top:1px solid var(--border);padding-top:8px;}
.round-games summary{cursor:pointer;font-size:12px;color:var(--muted);}
/* Court tabs — pinned while scrolling so a scorer can hop between courts */
.court-tabs{position:sticky;top:0;z-index:5;display:flex;gap:4px;overflow-x:auto;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:4px;margin-bottom:12px;}
.court-tab{flex:1 0 auto;display:flex;align-items:center;justify-content:center;gap:7px;padding:9px 12px;border:none;border-radius:7px;background:transparent;color:var(--muted);font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;}
.court-tab.active{background:var(--court-line);color:var(--accent);}
.court-tab-prog{font-family:'Space Mono',monospace;font-size:10px;font-weight:700;padding:2px 6px;border-radius:10px;background:var(--court-mid);color:var(--yellow);}
.court-tab.done .court-tab-prog{color:var(--up);}
/* Session */
.session-panel{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px;}
.session-title{font-size:15px;font-weight:700;margin-bottom:4px;}
.session-meta{font-size:12px;color:var(--muted);margin-bottom:12px;}
.progress-wrap{background:var(--border);border-radius:4px;height:4px;margin-bottom:16px;overflow:hidden;}
.progress-fill{height:100%;background:var(--accent);border-radius:4px;transition:width .3s;}
.court-block{background:var(--court-mid);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:12px;}
.court-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.court-lbl{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:1px;text-transform:uppercase;}
.court-fmt{font-size:11px;color:var(--muted);}
.court-pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
.pill{font-size:12px;font-weight:600;background:var(--court-line);border:1px solid var(--border);border-radius:20px;padding:3px 10px;display:inline-flex;align-items:center;gap:5px;}
.pill-remove{background:none;border:none;color:var(--red);cursor:pointer;font-size:12px;font-weight:700;padding:0;line-height:1;}
.max-score-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px;font-size:12px;color:var(--muted);}
.score-opt{padding:4px 12px;border-radius:5px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:12px;font-weight:700;cursor:pointer;font-family:'Space Grotesk',sans-serif;}
.score-opt.active{background:var(--accent);color:var(--on-accent);border-color:var(--accent);}
.game-card{background:var(--bg);border:1px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden;}
.game-card-hdr{display:flex;align-items:center;justify-content:space-between;padding:7px 12px;border-bottom:1px solid var(--border);}
.game-num{font-family:'Space Mono',monospace;font-size:10px;color:var(--muted);}
.game-status-done{font-size:10px;font-weight:700;color:var(--up);}
.game-status-pending{font-size:10px;font-weight:700;color:var(--yellow);}
.game-score-body{display:grid;grid-template-columns:1fr auto 1fr;}
.pair-col{display:flex;flex-direction:column;align-items:center;padding:12px 8px;gap:6px;cursor:pointer;transition:background .15s;}
.pair-col:hover{background:var(--accent-dim);}
.pair-col.won{background:var(--up-dim);}
.pair-col.lost{opacity:.4;}
.pair-names-stacked{text-align:center;font-size:13px;font-weight:700;line-height:1.4;}
.pair-amp{font-size:11px;color:var(--muted);font-weight:400;}
.score-inputs{display:flex;align-items:center;gap:6px;margin-top:4px;}
.score-input{width:48px;height:38px;text-align:center;background:var(--court-mid);border:1px solid var(--border);border-radius:7px;color:var(--text);font-family:'Space Mono',monospace;font-size:18px;font-weight:700;outline:none;}
.score-input:focus{border-color:var(--accent);}
.score-input.winning{border-color:var(--up);color:var(--up);}
.score-input.losing{border-color:var(--border);color:var(--muted);}
.score-input.invalid{border-color:var(--red);color:var(--red);}
.score-msg{font-size:11px;color:var(--red);text-align:center;line-height:1.4;padding:0 12px;}
.score-msg:not(:empty){padding:0 12px 9px;}
.score-opt:disabled{opacity:.35;cursor:not-allowed;}
.vs-col{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 6px;background:var(--court-mid);border-left:1px solid var(--border);border-right:1px solid var(--border);}
.vs-text{font-family:'Space Mono',monospace;font-size:10px;color:var(--muted);}
.vs-score{font-family:'Space Mono',monospace;font-size:14px;font-weight:700;color:var(--text);margin-top:4px;}
.edit-btn{font-size:10px;color:var(--muted);background:transparent;border:none;cursor:pointer;text-decoration:underline;padding:2px;}
.scoreboard{margin-top:10px;border-top:1px solid var(--border);padding-top:10px;}
.scoreboard-title{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.sb-row{display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border);}
.sb-row:last-child{border-bottom:none;}
.sb-rank{font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);width:20px;}
.sb-name{font-size:13px;font-weight:600;flex:1;}
.sb-pts{font-family:'Space Mono',monospace;font-size:13px;font-weight:700;color:var(--accent);}
.sb-tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;margin-left:6px;}
.tag-up{background:var(--up-dim);color:var(--up);border:1px solid var(--up);}
.climber-mark{font-size:11px;color:var(--up);font-weight:700;cursor:help;}
.tag-down{background:var(--red-dim);color:var(--red);border:1px solid var(--red);}
.section-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}
.add-form{display:flex;gap:8px;margin-bottom:16px;}
.add-input{flex:1;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-family:'Space Grotesk',sans-serif;font-size:14px;outline:none;}
.add-input:focus{border-color:var(--accent);}
.add-input::placeholder{color:var(--muted);}
.add-btn{background:var(--accent);color:var(--on-accent);border:none;padding:10px 16px;border-radius:8px;font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:700;cursor:pointer;}
.btn-row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
.btn{padding:10px 16px;border-radius:8px;font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:700;cursor:pointer;border:none;}
.btn-primary{background:var(--accent);color:var(--on-accent);}
.btn-primary:disabled{opacity:.35;cursor:not-allowed;}
.btn-danger{background:transparent;border:1px solid var(--red);color:var(--red);}
.btn-danger:disabled{opacity:.35;cursor:not-allowed;}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text);}
.modal-bg{position:fixed;inset:0;background:var(--overlay);z-index:100;display:flex;align-items:center;justify-content:center;padding:14px;}
.modal{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;width:100%;max-width:460px;max-height:90vh;overflow-y:auto;}
.modal-title{font-size:17px;font-weight:700;margin-bottom:4px;}
.modal-sub{font-size:12px;color:var(--muted);margin-bottom:16px;}
.modal-close{float:right;background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;margin-top:-4px;}
.team-choice{display:flex;width:100%;align-items:center;gap:12px;text-align:left;background:var(--court-mid);border:1px solid var(--border);border-radius:10px;padding:13px 14px;margin-bottom:8px;color:var(--text);font-family:'Space Grotesk',sans-serif;cursor:pointer;transition:background .15s,border-color .15s;}
.team-choice:hover,.team-choice.current{background:var(--accent-dim);border-color:var(--accent);}
.team-choice-name{font-size:14px;font-weight:700;flex:1;}
.team-choice-role{font-family:'Space Mono',monospace;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
.team-choice.current .team-choice-role{color:var(--accent);}
.profile-wrap{position:relative;}
.profile-popover{position:absolute;top:calc(100% + 9px);right:0;width:310px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px;box-shadow:0 18px 42px var(--shadow);z-index:110;}
.profile-summary{display:flex;align-items:center;gap:10px;padding:7px 7px 13px;}
.profile-avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--accent-dim);border:1px solid var(--accent);color:var(--accent);font-weight:700;font-family:'Space Mono',monospace;}
.profile-email{font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px;}
.profile-role{font-size:10px;color:var(--muted);margin-top:2px;}
.profile-action{display:flex;width:100%;align-items:center;gap:10px;text-align:left;background:transparent;border:0;border-radius:8px;padding:10px;color:var(--text);font-family:'Space Grotesk',sans-serif;cursor:pointer;}
.profile-action:hover{background:var(--court-mid);}
.profile-action-icon{width:20px;text-align:center;}
.profile-action-label{font-size:13px;font-weight:700;flex:1;}
.profile-action-meta{font-family:'Space Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;}
.profile-divider{height:1px;background:var(--border);margin:7px 3px;}

<body>
<div class="wrap">
<header>
<div>

</div>
<div style="display:flex;gap:8px;align-items:center;"><button class="session-btn" id="new-session-btn">+ New Session</button><div class="profile-wrap" id="profile-wrap"><button class="session-btn" id="profile-btn" style="background:transparent;color:var(--text);border:1px solid var(--border);">👤 Profile</button></div></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ── Cloud config (Supabase) ───────────────────────────────────────────
// Paste your project values here. The anon key is public by design — access is enforced by the
// database's row-level security. NEVER put the service_role key in this file.
const SUPABASE_URL='https://eluuemndsfyvumgkheta.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVsdXVlbW5kc2Z5dnVtZ2toZXRhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5MjI4NTQsImV4cCI6MjEwNTQ5ODg1NH0.vx2nhZ9igEYOcc1PJrsAxyXvvheHWDMQc8mjmawKmLc'; // public anon key — safe in the page; never use service_role here

// ── State ─────────────────────────────────────────────────────────────
const KEY='smash_v3';
const DIRTY_KEY='smash_dirty'; // set while this device has changes the cloud hasn't confirmed yet
function def(){return{players:[],nextId:1,sessions:[],activeSession:null};}
function load(){try{return JSON.parse(localStorage.getItem(KEY))||def();}catch{return def();}}
let S=load();
const CLOUD=!!(SUPABASE_URL&&SUPABASE_ANON_KEY&&window.supabase);
let SB=null,USER=null,CAN_EDIT=false,CAN_SCORE=false,CURRENT_TEAM=null,TEAMS=[],channel=null,TOKEN='';
let syncTimer=null,reloadTimer=null,pushing=false,lastPushAt=0,saveSeq=0,syncedSigs={};
let syncStatus={state:'idle',msg:''}; // idle|syncing|synced|error

function save(){
localStorage.setItem(KEY,JSON.stringify(S));
if(!CLOUD||!CAN_EDIT||!CURRENT_TEAM)return;
saveSeq++;
localStorage.setItem(DIRTY_KEY,'1');
scheduleSync();
}

// ── Cloud sync ────────────────────────────────────────────────────────
// One scorer writes, everyone else reads. Writes go up as a single atomic push_state() call;
// changes made by the scorer reach every other signed-in device through realtime.
function stable(o){
if(Array.isArray(o))return'['+o.map(stable).join(',')+']';
if(o&&typeof o==='object')return'{'+Object.keys(o).sort().map(k=>JSON.stringify(k)+':'+stable(o[k])).join(',')+'}';
return JSON.stringify(o===undefined?null:o);
}
function ensureSessionIds(){S.sessions.forEach((s,i)=>{if(!s.id)s.id='s'+Date.now().toString(36)+'-'+i;});}
// Last-chance save when the tab is hidden or closed. A normal request would be cancelled with the
// page, so this uses fetch({keepalive:true}) straight to the same push_state function.
function flushOnHide(){
flushScoreDrafts(); // a score typed just before hiding is still waiting on its pause timer
if(!CLOUD||!CAN_EDIT||!TOKEN||!localStorage.getItem(DIRTY_KEY))return;
clearTimeout(syncTimer);
const seq=saveSeq;
const{sigs,payload}=buildPayload();
const body=JSON.stringify({p_team_id:CURRENT_TEAM.team_id,p:payload});
if(body.length>60000){pushToBackend();return;} // keepalive requests are capped at ~64 KB
lastPushAt=Date.now();
try{
fetch(SUPABASE_URL+'/rest/v1/rpc/push_team_state',{method:'POST',keepalive:true,
headers:{'Content-Type':'application/json',apikey:SUPABASE_ANON_KEY,Authorization:'Bearer '+TOKEN},body})
.then(r=>{if(r.ok){syncedSigs=sigs;if(seq===saveSeq)localStorage.removeItem(DIRTY_KEY);}})
.catch(()=>{});
}catch(e){}
}
function setSync(state,msg){
syncStatus={state,msg};
const b=document.getElementById('live-badge');
if(b){
b.textContent=!CLOUD?'':state==='synced'?'● Live':state==='syncing'?'● Saving…':state==='error'?'● Offline':'';
b.style.color=state==='synced'?'var(--up)':state==='syncing'?'var(--yellow)':'var(--red)';
}
if(currentTab==='settings')renderSettings();
}
function scheduleSync(){
if(!CLOUD||!CAN_EDIT||!SB)return;
clearTimeout(syncTimer);
syncTimer=setTimeout(pushToBackend,600);
}
function buildPayload(){
ensureSessionIds();
const sigs={};
S.sessions.forEach((s,i)=>{
sigs[s.id]=i+'|'+stable(s);
});
return{sigs,payload:S};
}
async function pushToBackend(){
if(!CLOUD||!CAN_EDIT||!SB)return;
if(pushing){scheduleSync();return;}
pushing=true;setSync('syncing','Saving…');
const seq=saveSeq;
const{sigs,payload}=buildPayload();
let error=null;
try{({error}=await SB.rpc('push_team_state',{p_team_id:CURRENT_TEAM.team_id,p:payload}));}catch(e){error=e;}
pushing=false;lastPushAt=Date.now();
if(error){
setSync('error','Save failed: '+(error.message||error)+' — retrying');
clearTimeout(syncTimer);syncTimer=setTimeout(pushToBackend,10000);
return;
}
syncedSigs=sigs;
if(seq===saveSeq)localStorage.removeItem(DIRTY_KEY); // nothing newer waiting
setSync('synced','Saved '+new Date().toLocaleTimeString());
}
async function loadAll(){
if(!CURRENT_TEAM)throw new Error('Choose a team first');
const{data,error}=await SB.rpc('load_team_state',{p_team_id:CURRENT_TEAM.team_id});
if(error||!data)throw new Error(error?error.message:'You do not have access to this team');
S=data;
localStorage.setItem(KEY,JSON.stringify(S));
syncedSigs={};
S.sessions.forEach((s,i)=>syncedSigs[s.id]=i+'|'+stable(s));
}
function renderUnlessTyping(){
const a=document.activeElement;
if(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA')&&!a.closest('.modal')){
a.addEventListener('blur',()=>render(),{once:true}); // don't steal focus mid-typing
return;
}
render();
}
async function refreshFromCloud(){
if(!SB)return;
try{await loadAll();setSync('synced','Live');}
catch(e){setSync('error','Load failed: '+e.message);return;}
renderUnlessTyping();
}
function onRemoteChange(){
// the scorer's own writes echo back through realtime — ignore those (and anything while unsaved)
if(CAN_EDIT&&(pushing||localStorage.getItem(DIRTY_KEY)||Date.now()-lastPushAt<4000))return;
clearTimeout(reloadTimer);
reloadTimer=setTimeout(refreshFromCloud,400);
}
function subscribeRealtime(){
if(channel)SB.removeChannel(channel);
channel=SB.channel('ladder-live');
['team_players','team_sessions','team_active_sessions','team_meta'].forEach(t=>
channel.on('postgres_changes',{event:'*',schema:'public',table:t},onRemoteChange));
channel.subscribe(status=>{
if(status==='SUBSCRIBED')setSync('synced','Live');
else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'||status==='CLOSED')setSync('error','Live updates disconnected');
});
}

// ── Sign-in & start-up ────────────────────────────────────────────────
async function startApp(){
const{data:{session}}=await SB.auth.getSession();
if(!session){showLoginGate(linkError);linkError='';return;}
USER=session.user;TOKEN=session.access_token;
const{data:teams,error:teamError}=await SB.rpc('list_accessible_teams');
if(teamError||!teams||!teams.length){showNoTeamGate(teamError?.message||linkError);linkError='';return;}
TEAMS=teams;
const remembered=localStorage.getItem('smash_current_team');
CURRENT_TEAM=TEAMS.find(t=>t.team_id===remembered)||TEAMS[0];
CAN_EDIT=CURRENT_TEAM.app_role==='team_admin'||CURRENT_TEAM.app_role==='platform_admin';
CAN_SCORE=CAN_EDIT||CURRENT_TEAM.app_role==='scorer';
document.body.classList.toggle('viewer',!CAN_EDIT&&!CAN_SCORE);
document.body.classList.toggle('scorer',!CAN_EDIT&&CAN_SCORE);
document.body.classList.toggle('platform-admin',CURRENT_TEAM.app_role==='platform_admin');
el('team-name').textContent=CURRENT_TEAM.team_name;
if((!CAN_EDIT&&currentTab==='players')||(!CAN_EDIT&&currentTab==='members')||(!CAN_EDIT&&currentTab==='settings')||(CURRENT_TEAM.app_role!=='platform_admin'&&currentTab==='admin'))showTab('ladder');
if(!CAN_EDIT)localStorage.removeItem(DIRTY_KEY);

// Changes made on this device that may not have reached the cloud (offline, or closed too fast)
let loaded=false;
if(CAN_EDIT&&localStorage.getItem(DIRTY_KEY)){
const local=S;
try{await loadAll();loaded=true;}catch(e){}
const view=o=>stable({players:[...o.players].sort((a,b)=>a.id-b.id),sessions:o.sessions,activeSession:o.activeSession});
if(!loaded){S=local;scheduleSync();}                       // offline: keep local work, keep retrying
else if(view(S)===view(local)){localStorage.removeItem(DIRTY_KEY);} // it did arrive after all
else if(confirm('This device has changes that never reached the cloud.\n\nOK = upload them (overwrites the cloud version)\nCancel = discard them and load the cloud version')){
S=local;syncedSigs={};localStorage.setItem(KEY,JSON.stringify(S));
await pushToBackend();
}else{
localStorage.removeItem(DIRTY_KEY);
}
}
if(!loaded&&!localStorage.getItem(DIRTY_KEY)){
try{await loadAll();setSync('synced','Live');}
catch(e){setSync('error','Load failed: '+e.message);}
}else if(loaded){setSync('synced','Live');}
render();
subscribeRealtime();
}
async function switchTeam(id){
const next=TEAMS.find(t=>t.team_id===id);if(!next)return;
localStorage.setItem('smash_current_team',id);CURRENT_TEAM=next;
await startApp();
}
function showTeamSwitcher(){
if(!TEAMS.length)return;
const roleLabel=role=>role==='platform_admin'?'Platform Admin':role==='team_admin'?'Team Admin':role==='scorer'?'Scoring User':'Viewer';
const m=document.createElement('div');m.className='modal-bg';m.id='team-switcher';
const choices=TEAMS.map(t=>'<button class="team-choice'+(t.team_id===CURRENT_TEAM?.team_id?' current':'')+'" data-team-id="'+t.team_id+'"><span class="team-choice-name">'+esc(t.team_name)+'</span><span class="team-choice-role">'+roleLabel(t.app_role)+(t.team_id===CURRENT_TEAM?.team_id?' · Current':'')+'</span></button>').join('');
m.innerHTML='<div class="modal"><button class="modal-close" id="team-switcher-close" aria-label="Close">✕</button><div class="modal-title">Choose a team</div><div class="modal-sub">Switch to a team you can access.</div>'+choices+'</div>';
document.body.appendChild(m);
el('team-switcher-close').addEventListener('click',()=>m.remove());
m.addEventListener('click',e=>{if(e.target===m)m.remove();});
m.querySelectorAll('[data-team-id]').forEach(btn=>btn.addEventListener('click',async()=>{const id=btn.dataset.teamId;m.remove();if(id!==CURRENT_TEAM?.team_id)await switchTeam(id);}));
}
function showProfileMenu(){
const old=el('profile-menu');if(old)old.remove();
const roleLabel=CURRENT_TEAM?.app_role==='platform_admin'?'Platform Admin':CURRENT_TEAM?.app_role==='team_admin'?'Team Admin':CURRENT_TEAM?.app_role==='scorer'?'Scoring User':'Viewer';
const m=document.createElement('div');m.className='profile-popover';m.id='profile-menu';
const action=(id,icon,label,meta,extra='')=>'<button class="profile-action '+extra+'" id="'+id+'"><span class="profile-action-icon">'+icon+'</span><span class="profile-action-label">'+label+'</span><span class="profile-action-meta">'+meta+'</span></button>';
let actions=action('profile-teams','🏸','Teams','Switch')+action('profile-theme','🎨','Theme',THEMES.find(x=>x.id===themePref().t).name);
if(CURRENT_TEAM?.app_role==='platform_admin')actions+=action('profile-admin','🛡️','Admin','Platform');
if(CAN_EDIT)actions+=action('profile-settings','⚙️','Settings','Team');
actions+='<div class="profile-divider"></div>'+action('profile-logout','↪','Log out','Account','danger');
const email=USER?.email||(USER?.is_anonymous?'Guest viewer':'—');
m.innerHTML='<div class="profile-summary"><div class="profile-avatar">'+esc(email.charAt(0).toUpperCase())+'</div><div><div class="profile-email">'+esc(email)+'</div><div class="profile-role">'+roleLabel+'</div></div></div><div class="profile-divider"></div>'+actions;
el('profile-wrap').appendChild(m);
let onOutside;
const close=()=>{m.remove();if(onOutside)document.removeEventListener('click',onOutside);};
m.closeProfilePopover=close;
el('profile-teams').addEventListener('click',e=>{e.stopPropagation();showTeamsInProfile(m);});
el('profile-theme').addEventListener('click',e=>{e.stopPropagation();showThemeInProfile(m);});
if(el('profile-admin'))el('profile-admin').addEventListener('click',()=>{close();showTab('admin');});
if(el('profile-settings'))el('profile-settings').addEventListener('click',()=>{close();showTab('settings');});
el('profile-logout').addEventListener('click',()=>{close();logout();});
onOutside=e=>{if(!el('profile-wrap')?.contains(e.target))close();};
setTimeout(()=>{if(el('profile-menu')===m)document.addEventListener('click',onOutside);},0);
}
// ── Theme (per device) ────────────────────────────────────────────────
const THEMES=[
{id:'court',name:'Court green',sw:['#15803d','#4ade80']},
{id:'night',name:'Night match',sw:['#1d3a8a','#d4f542']},
{id:'indigo',name:'Arena indigo',sw:['#5b47d6','#a99bff']},
{id:'clay',name:'Clay court',sw:['#b8501c','#f08a4b']}
];
const themeMemory={}; // fallback when this browser blocks storage
function themePref(){
let t=themeMemory.smash_theme||'court',m=themeMemory.smash_mode||'system';
try{t=localStorage.getItem('smash_theme')||t;m=localStorage.getItem('smash_mode')||m;}catch(e){}
if(!THEMES.some(x=>x.id===t))t='court';
return{t,m};
}
const lightQuery=matchMedia('(prefers-color-scheme: light)');
function applyTheme(){
const{t,m}=themePref(),d=document.documentElement;
d.dataset.theme=t;
d.dataset.mode=m==='system'?(lightQuery.matches?'light':'dark'):m;
}
lightQuery.addEventListener('change',applyTheme); // "System" follows the OS as it switches
document.addEventListener('visibilitychange',()=>{if(!document.hidden)applyTheme();}); // in case the switch happened while hidden
function setThemePref(key,val){themeMemory[key]=val;try{localStorage.setItem(key,val);}catch(e){}applyTheme();}
function showThemeInProfile(m){
const{t,m:mode}=themePref();

// ── Ladder ────────────────────────────────────────────────────────────
// The ladder after each of the last `n` sessions, oldest first: [{s, after:{id:rank}, delta:{id:±n}, exact}].
// Sessions finalised with a rank snapshot are exact. Older ones are rebuilt by walking back from the
// next known ladder with that session's rank changes — approximate if ranks were edited by hand or
// players were added/removed in between.
function ladderHistory(n){
const idByName={};S.players.forEach(p=>idByName[p.name]=p.id);
let known={};S.players.forEach(p=>known[p.id]=p.rank); // ladder after the session being looked at
const out=[];
for(let k=S.sessions.length-1;k>=0&&out.length<n;k--){
const s=S.sessions[k];
const after=s.ranksAfter||known;
const delta={};(s.rankChanges||[]).forEach(r=>{const id=idByName[r.name];if(id!==undefined)delta[id]=r.delta;});
out.unshift({s,after,delta,exact:!!s.ranksAfter});
const before={};Object.keys(after).forEach(id=>before[id]=after[id]+(delta[id]||0));
known=before;
}
return out;
}
// Wins, losses and points per player across every round of a session
function sessionPlayerStats(s){
const st={};
(s.rounds&&s.rounds.length?s.rounds:[{courts:s.courts||[]}]).forEach(r=>(r.courts||[]).forEach(c=>c.games.forEach(g=>{
if(g.s1===null||g.s2===null)return;
const add=(ids,pts,won)=>ids.forEach(id=>{const x=st[id]||(st[id]={w:0,l:0,pts:0});x.pts+=pts;won?x.w++:x.l++;});
add(g.pair1,g.s1,g.s1>g.s2);add(g.pair2,g.s2,g.s2>g.s1);
})));
return st;
}
function shortDate(d){const[day,mon]=String(d).split(' ');return mon?day+' '+mon.slice(0,3):String(d);}
function renderLadder(){
const sorted=[...S.players].sort((a,b)=>a.rank-b.rank);
const root=el('tab-ladder');
if(!sorted.length){root.innerHTML='<div class="empty"><div class="empty-icon">🏸</div>No players yet.<br>Add players in the Players tab.</div>';return;}
const hist=ladderHistory(5).reverse(); // newest session first
const stats=hist.map(c=>sessionPlayerStats(c.s));
const cols='grid-template-columns:34px minmax(0,1fr)'+(hist.length?' repeat('+hist.length+',30px)':' auto')+';';
let h='<div class="ladder-head" style="'+cols+'"><span></span><span class="section-label" style="margin:0;">'+sorted.length+' players ranked</span>'
+hist.map(c=>'<span class="lh-date">'+esc(shortDate(c.s.date))+(c.exact?'':'≈')+'</span>').join('')+'</div>';
sorted.forEach(p=>{
const ac=p.rank===1?'gold':p.rank===2?'silver':p.rank===3?'bronze':'';
const rc=p.rank===1?'rank-gold':p.rank===2?'rank-silver':p.rank===3?'rank-bronze':'';
const wr=(p.wins+p.losses)>0?Math.round(p.wins/(p.wins+p.losses)*100):0;
let tail;
if(hist.length){
tail=hist.map((c,i)=>{
const r=c.after[p.id];
if(r===undefined)return'<span class="lh-cell none" data-tip-title="'+esc(c.s.date)+'" data-tip="Not on the ladder yet"></span>';
const d=c.delta[p.id]||0,absent=(c.s.skipped||[]).includes(p.id),st=stats[i][p.id];
const move=d>0?'▲'+d+' from #'+(r+d):d<0?'▼'+(-d)+' from #'+(r+d):'no change';
const tip='#'+r+' · '+move+'|'+(absent?'Absent · dropped 2 places':st?st.w+'W '+st.l+'L · '+st.pts+' pts':'Played, no scored games');
return'<span class="lh-cell'+(d>0?' up':d<0?' down':'')+(absent?' absent':'')+'" tabindex="0" data-tip-title="'+esc(c.s.date)+'" data-tip="'+esc(tip)+'">'+r+'</span>';
}).join('');
}else{
const d=p.rankDelta||0;
tail=d>0?'<span class="delta delta-up">▲'+d+'</span>':d<0?'<span class="delta delta-down">▼'+Math.abs(d)+'</span>':'<span class="delta delta-none">—</span>';
}
h+='<div class="card '+rc+'"><div class="card-accent '+ac+'"></div><div class="player-row ladder-row" style="'+cols+'"><div class="rank-num">'+p.rank+'</div><div style="min-width:0;"><div class="player-name">'+esc(p.name)+'</div><div class="player-stats">'+p.wins+'W · '+p.losses+'L · '+(p.totalPts||0)+' pts'+(p.sessions>0?' · '+wr+'% win rate':'')+'</div></div>'+tail+'</div></div>';
});
if(hist.length)h+='<div class="lh-legend"><span class="lh-cell up">3</span> climbed <span class="lh-cell down">5</span> dropped <span class="lh-cell absent">7</span> absent (−2) · rank after each of the last '+hist.length+' session'+(hist.length>1?'s':'')+', newest → oldest'+(hist.some(c=>!c.exact)?' · ≈ rebuilt from older data, may be approximate':'')+'</div>';
root.innerHTML=h;
}

// ── Set player rank manually ──────────────────────────────────────────
function setPlayerRank(pid,newRank){
pid=Number(pid);
const target=gp(pid);
if(!target)return;
const oldRank=target.rank;
if(newRank===oldRank)return;
// Shift others: if moving up (lower number), push others down; if moving down, push others up
S.players.forEach(p=>{
if(p.id===pid)return;
if(newRank<oldRank && p.rank>=newRank && p.rank<oldRank) p.rank++;
if(newRank>oldRank && p.rank<=newRank && p.rank>oldRank) p.rank--;
});
target.rank=newRank;
// Normalise to remove any gaps
[...S.players].sort((a,b)=>a.rank-b.rank).forEach((p,i)=>p.rank=i+1);
save();renderPlayers();toast(target.name+' moved to #'+newRank);
}

function sessionSizes(){

function sizesError(n,sizes){
if(n<4)return'Need at least 4 attending players.';
if(sizes.length<1)return'Need at least 1 court.';
if(setup.splitMode==='custom'){
const sum=sizes.reduce((a,b)=>a+b,0);
if(sum!==n)return'Court sizes add up to '+sum+' but '+n+' player'+(n===1?' is':'s are')+' selected.';
if(!sizesValid(sizes,7))return'Custom courts need 4 to 7 players each — got '+sizes.join(', ')+'.';
return null;
}
if(!sizesValid(sizes))return'Doubles needs every court to have exactly 4 or 5 players — got '+sizes.join(', ')+'. Adjust attendance or court count, or use a Custom split.';
return null;
}

function closeModal(){const m=el('setup-modal');if(m)m.remove();}

// ── Pairings (doubles round-robin) ──────────────────────────────────────
function pairings4(ids){
const[a,b,c,d]=ids;
return[
{pair1:[a,b],pair2:[c,d],sitOut:null,s1:null,s2:null},
{pair1:[a,c],pair2:[b,d],sitOut:null,s1:null,s2:null},
{pair1:[a,d],pair2:[b,c],sitOut:null,s1:null,s2:null}
];
}
function pairings5(ids){
const[a,b,c,d,e]=ids;
return[
{pair1:[a,b],pair2:[c,d],sitOut:e,s1:null,s2:null},
{pair1:[a,c],pair2:[b,e],sitOut:d,s1:null,s2:null},
{pair1:[a,d],pair2:[c,e],sitOut:b,s1:null,s2:null},
{pair1:[a,e],pair2:[b,d],sitOut:c,s1:null,s2:null},
{pair1:[b,c],pair2:[d,e],sitOut:a,s1:null,s2:null}
];
}
// 6 and 7: every player plays 4 games, no partner repeats, opponents balanced
function pairings6(ids){
const[a,b,c,d,e,f]=ids;
return[
{pair1:[b,e],pair2:[c,f],sitOut:[a,d],s1:null,s2:null},
{pair1:[a,e],pair2:[b,d],sitOut:[c,f],s1:null,s2:null},
{pair1:[a,c],pair2:[e,f],sitOut:[b,d],s1:null,s2:null},
{pair1:[a,d],pair2:[b,c],sitOut:[e,f],s1:null,s2:null},
{pair1:[b,f],pair2:[d,e],sitOut:[a,c],s1:null,s2:null},
{pair1:[a,f],pair2:[c,d],sitOut:[b,e],s1:null,s2:null}
];
}
function pairings7(ids){
const[a,b,c,d,e,f,g]=ids;
return[
{pair1:[a,f],pair2:[b,c],sitOut:[d,e,g],s1:null,s2:null},
{pair1:[b,e],pair2:[d,f],sitOut:[a,c,g],s1:null,s2:null},
{pair1:[b,d],pair2:[e,g],sitOut:[a,c,f],s1:null,s2:null},
{pair1:[a,c],pair2:[d,e],sitOut:[b,f,g],s1:null,s2:null},
{pair1:[b,f],pair2:[c,g],sitOut:[a,d,e],s1:null,s2:null},
{pair1:[a,g],pair2:[c,e],sitOut:[b,d,f],s1:null,s2:null},
{pair1:[a,d],pair2:[f,g],sitOut:[b,c,e],s1:null,s2:null}
];
}
function sitOutNames(g){
if(!g.sitOut)return'';
return(Array.isArray(g.sitOut)?g.sitOut:[g.sitOut]).map(id=>nameOf(id)).join(', ');
}
function buildGames(ids){
if(ids.length===7)return pairings7(ids);
if(ids.length===6)return pairings6(ids);
if(ids.length===5)return pairings5(ids);
if(ids.length===4)return pairings4(ids);
return[];
}
function courtSizes(n,numCourts){
const base=Math.floor(n/numCourts),extra=n%numCourts;
return Array.from({length:numCourts},(_,c)=>base+(c>=numCourts-extra?1:0));
}
function sizesValid(sizes,max=5){
return sizes.every(s=>s>=4&&s<=max);
}
function buildCourts(ids,sizes){
const sorted=[...ids].sort((a,b)=>gp(a).rank-gp(b).rank);
const courts=[];let idx=0;
sizes.forEach(size=>{
const cp=sorted.slice(idx,idx+size);idx+=size;
courts.push({players:cp,games:buildGames(cp),maxScore:21});
});
return courts;
}
function startSession(){
const att=[...setup.attending];
const sizes=sessionSizes();
const err=sizesError(att.length,sizes);
if(err){toast(err);return;}
const courts=buildCourts(att,sizes);
scoreDrafts={};scoreErrors={};
const bands=courts.map(c=>c.players.map(id=>gp(id).rank).sort((a,b)=>a-b));
S.activeSession={
date:new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}),
numRounds:1, // grows as rounds are added; always equals round
rankBasis:setup.rankBasis,
round:1,
bands:bands,
courts:courts,
rounds:[],
skipped:S.players.map(p=>p.id).filter(id=>!setup.attending.has(id)),
attending:att
};
save();closeModal();showTab('session');toast('Session started! 🏸');
}

// ── Score entry ───────────────────────────────────────────────────────
// Each court plays to its game length (15 or 21). By default the game ends there — 21–20 is a
// finished game. With deuce on (court.deuce), at (length−1)-all play goes on until one side is 2
// clear, up to a cap where the next point wins (29-all → 30 for 21-point games, 20-all → 21 for 15).
const SCORE_CAPS={15:21,21:30};
function scoreCap(max,deuce){return deuce?SCORE_CAPS[max]||max+9:max;}
// Why s1–s2 can't be a finished game under this court's rules, or null when it can.
function scoreError(s1,s2,max,deuce){
const cap=scoreCap(max,deuce),w=Math.max(s1,s2),l=Math.min(s1,s2);
if(w===l)return'A game can\'t end level.';
if(!deuce){
if(w!==max)return'Games on this court end at exactly '+max+' (deuce is off).';
return null;
}
if(w>cap)return'Scores stop at '+cap+' — at '+(cap-1)+'-all the next point wins.';
if(w<max)return'The winning side needs '+max+' points.';
if(w===max&&l>max-2)return'At '+(max-1)+'-all play on until one side is 2 clear (e.g. '+(max+1)+'–'+(max-1)+').';
if(w>max&&l!==w-2&&!(w===cap&&l===cap-1))return'Past '+max+' a game ends 2 clear (e.g. '+(max+2)+'–'+max+') or at '+cap+'–'+(cap-1)+'.';
return null;
}
let courtTab=(()=>{try{return Number(localStorage.getItem('smash_court_tab'))||0;}catch(e){return 0;}})();
let scoreDrafts={};   // typed-but-unsaved box values, keyed by gameKey()+'|'+pair
let scoreErrors={};   // gameKey() -> why the typed score was rejected
const scoreTimers={};
let sessionRendering=false; // the session DOM is being replaced — ignore the blur that causes
// Identifies a game by round, court and pairs, so drafts survive re-renders but never leak into
// a different game after courts are rebuilt.
function gameKey(s,ci,gi){const g=s.courts[ci].games[gi];return s.round+'|'+ci+'|'+g.pair1.join(',')+'v'+g.pair2.join(',');}
function clearScoreDraft(gk){delete scoreDrafts[gk+'|1'];delete scoreDrafts[gk+'|2'];delete scoreErrors[gk];}
function flushScoreDrafts(){
Object.keys(scoreTimers).forEach(k=>{const[ci,gi]=k.split('-').map(Number);commitScore(ci,gi);});
}
function scheduleScoreCommit(ci,gi){
const k=ci+'-'+gi;
clearTimeout(scoreTimers[k]);
scoreTimers[k]=setTimeout(()=>commitScore(ci,gi),1500);
}
// Committing a score re-renders the session. When the commit comes from leaving a box, wait until
// the tap/click that moved focus has finished — otherwise the element being tapped is replaced
// mid-click and the tap (or the focus it gives) is lost.
let pointerIsDown=false,afterPointer=[];
function afterInteraction(fn){if(pointerIsDown)afterPointer.push(fn);else setTimeout(fn,0);}
document.addEventListener('pointerdown',()=>{pointerIsDown=true;},true);
['pointerup','pointercancel'].forEach(t=>document.addEventListener(t,()=>{
pointerIsDown=false;
const fns=afterPointer;afterPointer=[];
setTimeout(()=>fns.forEach(f=>f()),0); // runs after the click event has been dispatched
},true));
function rerenderSessionKeepingFocus(){
if(currentTab!=='session')return;
const a=document.activeElement,id=a&&a.id,ss=a&&a.selectionStart,se=a&&a.selectionEnd;
renderSession();
const r=id&&el(id);
if(r&&r!==document.activeElement){r.focus();try{r.setSelectionRange(ss,se);}catch(e){}}
}
async function commitScore(ci,gi){
clearTimeout(scoreTimers[ci+'-'+gi]);
const s=S.activeSession,court=s&&s.courts[ci],game=court&&court.games[gi];
if(!game)return;
const gk=gameKey(s,ci,gi);
const d1=scoreDrafts[gk+'|1'],d2=scoreDrafts[gk+'|2'];
if(d1===undefined&&d2===undefined)return; // nothing typed
const v1=d1!==undefined?d1:String(game.s1??''),v2=d2!==undefined?d2:String(game.s2??'');
if(v1===''||v2==='')return; // wait for the other box
const s1=Number(v1),s2=Number(v2);
if(s1===game.s1&&s2===game.s2){clearScoreDraft(gk);return;}
const err=scoreError(s1,s2,court.maxScore,court.deuce);
if(err){scoreErrors[gk]=err;rerenderSessionKeepingFocus();return;}
if(!CAN_EDIT&&CAN_SCORE){
const{error}=await SB.rpc('save_current_game_score',{p_team_id:CURRENT_TEAM.team_id,p_court_index:ci,p_game_index:gi,p_expected_score_1:game.s1,p_expected_score_2:game.s2,p_score_1:s1,p_score_2:s2});
if(error){
if(error.message?.startsWith('Score conflict:')){clearScoreDraft(gk);toast('Score conflict — latest score loaded.');await refreshFromCloud();return;}
toast('Score not saved: '+error.message);return;
}
clearScoreDraft(gk);
await refreshFromCloud();return;
}
game.s1=s1;game.s2=s2;
clearScoreDraft(gk);
save();rerenderSessionKeepingFocus();
}

// ── Session render ────────────────────────────────────────────────────
// "Session so far": each finished round's final standings per court (newest first), with where

h+='<div class="round-summary-court">Court '+(ci+1)+'</div>';

h+='<details class="round-games"><summary>Game scores</summary>';
r.courts.forEach((c,ci)=>{

c.games.forEach((g,gi)=>{

h+='</details></div>';
});
return h;
}
function renderSession(){
const root=el('tab-session');

root.innerHTML='<div class="empty"><div class="empty-icon">🎮</div>No active session.<br>Tap <strong>+ New Session</strong> to begin.</div>';

}
const s=S.activeSession;

+'<div class="session-title">Session — '+s.date+' · Round '+s.round+'</div>'

}).join('')+'</div>';
}

s.courts.forEach((court,ci)=>{
if(ci!==selCourt)return;
const{ranked,ptMap,winMap}=tallyCourt(court,s.rankBasis);
const climbers=court.climbers||[];
const numCourts=s.courts.length;
const courtScored=court.games.some(g=>g.s1!==null&&g.s2!==null);
const pastLength=court.games.some(g=>g.s1!==null&&g.s2!==null&&Math.max(g.s1,g.s2)>court.maxScore);

h+='<div class="court-block">'
+'<div class="court-hdr"><span class="court-lbl">🏸 Court '+(ci+1)+(ci===0&&numCourts>1?' (Top)':ci===numCourts-1&&numCourts>1?' (Bottom)':'')+'</span>'
+'<span class="court-fmt">'+court.players.length+'p · '+court.games.length+' games · to '+court.maxScore+(court.deuce?' (deuce, max '+scoreCap(court.maxScore,true)+')':', no deuce')+'</span></div>';

// Pills with remove buttons
h+='<div class="court-pills">';
court.players.forEach(id=>{
h+='<span class="pill">'+nameOf(id)
+' <button class="pill-remove" data-ci="'+ci+'" data-pid="'+id+'" title="Remove from session">✕</button></span>';
});
h+='</div>';

h+='<div class="max-score-row">Max score: '
+[15,21].map(n=>'<button class="score-opt'+(court.maxScore===n?' active':'')+'" data-ci="'+ci+'" data-ms="'+n+'"'+(courtScored&&court.maxScore!==n?' disabled title="Clear this court\'s scores to change the game length"':'')+'>'+n+'</button>').join('')
+'<span style="margin-left:10px;">Deuce:</span>'
+[{v:false,l:'Off'},{v:true,l:'On'}].map(o=>{
const locked=!o.v&&court.deuce&&pastLength; // switching off would invalidate games already past the length
return'<button class="score-opt'+(!!court.deuce===o.v?' active':'')+'" data-ci="'+ci+'" data-deuce="'+(o.v?1:0)+'"'+(locked?' disabled title="A game on this court went past '+court.maxScore+'"':'')+'>'+o.l+'</button>';

+'</div>';

court.games.forEach((game,gi)=>{

// Live scoreboard
const gamesPlayed=court.games.filter(g=>g.s1!==null&&g.s2!==null).length;

h+='<div class="scoreboard"><div class="scoreboard-title">Live Standings — Court '+(ci+1)+'</div>';
ranked.forEach((id,i)=>{

// ── Per-round computation (shared by advanceRound and finaliseSession) ─
function tallyCourt(court,rankBasis){
const ptMap={},winMap={};
court.players.forEach(id=>{ptMap[id]=0;winMap[id]=0;});
court.games.forEach(g=>{
if(g.s1!==null&&g.s2!==null){
g.pair1.forEach(id=>ptMap[id]=(ptMap[id]||0)+g.s1);
g.pair2.forEach(id=>ptMap[id]=(ptMap[id]||0)+g.s2);
if(g.s1>g.s2)g.pair1.forEach(id=>winMap[id]++);else g.pair2.forEach(id=>winMap[id]++);
}
});
// Order: wins (when ranking by wins) → points → a player who moved up into this court last round
// beats one who was already here (the climber stays up) → current ladder rank.
const climbers=court.climbers||[];
const ranked=[...court.players].sort((a,b)=>{
if(rankBasis==='wins'){
const dw=(winMap[b]||0)-(winMap[a]||0);
if(dw!==0)return dw;
}
const d=(ptMap[b]||0)-(ptMap[a]||0);if(d!==0)return d;
const dc=climbers.includes(b)-climbers.includes(a);if(dc!==0)return dc;
return gp(a).rank-gp(b).rank;
});
return{ranked,ptMap,winMap,players:court.players};
}
function accumulateStats(court){
const ptMap={};court.players.forEach(id=>ptMap[id]=0);
court.games.forEach(g=>{
if(g.s1!==null&&g.s2!==null){
g.pair1.forEach(id=>ptMap[id]=(ptMap[id]||0)+g.s1);
g.pair2.forEach(id=>ptMap[id]=(ptMap[id]||0)+g.s2);
if(g.s1>g.s2){
g.pair1.forEach(id=>{const p=gp(id);if(p){p.wins++;p.sessions++;}});
g.pair2.forEach(id=>{const p=gp(id);if(p){p.losses++;p.sessions++;}});
} else {
g.pair2.forEach(id=>{const p=gp(id);if(p){p.wins++;p.sessions++;}});
g.pair1.forEach(id=>{const p=gp(id);if(p){p.losses++;p.sessions++;}});
}
}
});
court.players.forEach(id=>{const p=gp(id);if(p)p.totalPts=(p.totalPts||0)+(ptMap[id]||0);});
}
// Exact inverse of accumulateStats — used when reopening an already-advanced round
function unaccumulateStats(court){
const ptMap={};court.players.forEach(id=>ptMap[id]=0);
const dec=(id,field)=>{const p=gp(id);if(p){p[field]=Math.max(0,(p[field]||0)-1);p.sessions=Math.max(0,(p.sessions||0)-1);}};
court.games.forEach(g=>{
if(g.s1!==null&&g.s2!==null){
g.pair1.forEach(id=>ptMap[id]=(ptMap[id]||0)+g.s1);
g.pair2.forEach(id=>ptMap[id]=(ptMap[id]||0)+g.s2);
if(g.s1>g.s2){
g.pair1.forEach(id=>dec(id,'wins'));
g.pair2.forEach(id=>dec(id,'losses'));
} else {
g.pair2.forEach(id=>dec(id,'wins'));
g.pair1.forEach(id=>dec(id,'losses'));
}
}
});
court.players.forEach(id=>{const p=gp(id);if(p)p.totalPts=Math.max(0,(p.totalPts||0)-(ptMap[id]||0));});
}
function computeRoundVirtualRanks(courts,bands,rankBasis){
const tallies=courts.map(c=>tallyCourt(c,rankBasis));
const virtual={};
tallies.forEach((t,ci)=>{
const slots=[...bands[ci]].sort((a,b)=>a-b);
t.ranked.forEach((id,i)=>{virtual[id]=slots[i];});
});
for(let ci=0;ci<courts.length-1;ci++){
const upperIds=tallies[ci].ranked;
const lowerIds=tallies[ci+1].ranked;
if(upperIds.length>=2&&lowerIds.length>=2){
const bU=[upperIds[upperIds.length-2],upperIds[upperIds.length-1]];
const tL=[lowerIds[0],lowerIds[1]];
const allRanks=[...bU,...tL].map(id=>virtual[id]).sort((a,b)=>a-b);
const ordered=[...tL,...bU];
ordered.forEach((id,i)=>{virtual[id]=allRanks[i];});
}
}
return virtual;
}
function regroupForNextRound(session,virtualRanks){
const rankToCourtIdx={};
session.bands.forEach((band,ci)=>band.forEach(r=>rankToCourtIdx[r]=ci));
const buckets=session.bands.map(()=>[]);
session.attending.forEach(id=>{
const vr=virtualRanks[id];
if(vr===undefined)return;
const ci=rankToCourtIdx[vr];
if(ci!==undefined)buckets[ci].push(id);
});
// remember who came up from a lower court — they win ties in the new round (see tallyCourt)
const prevCourtOf={};
session.courts.forEach((c,ci)=>c.players.forEach(id=>prevCourtOf[id]=ci));
return buckets.map((ids,ci)=>{
const sorted=[...ids].sort((a,b)=>virtualRanks[a]-virtualRanks[b]);
const climbers=sorted.filter(id=>prevCourtOf[id]>ci);
return{players:sorted,games:buildGames(sorted),maxScore:session.courts[ci]?session.courts[ci].maxScore:21,deuce:!!(session.courts[ci]&&session.courts[ci].deuce),climbers};
});
}

// ── Advance to next round ───────────────────────────────────────────────
function advanceRound(){
if(!CAN_EDIT){toast('Only a team admin can move to the next round');return;}
const s=S.activeSession;
if(!roundComplete(s)){toast('Score every game in Round '+s.round+' first');renderSession();return;}
s.courts.forEach(accumulateStats);
const virtual=computeRoundVirtualRanks(s.courts,s.bands,s.rankBasis);
s.rounds.push({courts:s.courts});
s.courts=regroupForNextRound(s,virtual);
s.round+=1;
s.numRounds=s.round;
save();renderSession();toast('Round '+(s.round-1)+' complete — Round '+s.round+' started! 🏸');
}
function roundComplete(s){
return!!s&&s.courts.every(c=>c.games.every(g=>g.s1!==null&&g.s2!==null));
}

// ── Remove the current round ────────────────────────────────────────────
// Discards the round on the courts and reopens the previous one (undoing the stats that
// advanceRound() booked for it), so the session can carry on or end from there.
function confirmRemoveRound(){
const s=S.activeSession;
if(!s||s.round<=1)return;
const n=s.round;
const scored=s.courts.reduce((sum,c)=>sum+c.games.filter(g=>g.s1!==null&&g.s2!==null).length,0);
const total=s.courts.reduce((sum,c)=>sum+c.games.length,0);
const body=scored
?'<strong>Round '+n+'</strong> is in progress ('+scored+' of '+total+' games scored). Removing it <strong>discards those scores</strong> and reopens Round '+(n-1)+' (its scores are kept).'
:'<strong>Round '+n+'</strong> has no scores yet. Removing it reopens Round '+(n-1)+', so you can end the session from there.';
confirmDialog({
title:'Remove Round '+n+'?',body,
confirmWord:'REMOVE',confirmLabel:scored?'Discard & remove':'Remove round',cancelLabel:'Keep round',
onConfirm:()=>{
if(S.activeSession?.round!==n){toast('Session changed — no round removed');render();return;}
removeLastRound();
}
});
}
function removeLastRound(){
const s=S.activeSession;
const prev=s&&s.rounds.pop();
if(!prev){renderSession();return;}
const removed=s.round;
prev.courts.forEach(unaccumulateStats);
s.courts=prev.courts;
s.round--;
s.numRounds=s.round;
save();renderSession();toast('Round '+removed+' removed');
}

// ── Finalise ──────────────────────────────────────────────────────────
function confirmEndSession(){
const s=S.activeSession;if(!s)return;
if(!roundComplete(s)){toast('Score every game in Round '+s.round+' first');return;}
const n=s.round;
confirmDialog({
title:'End today\'s session?',
body:'The session ends after <strong>'+n+' round'+(n>1?'s':'')+'</strong> and the ladder is updated for the '+s.attending.length+' players who played.'
+(s.skipped.length?' '+s.skipped.length+' absent player'+(s.skipped.length>1?'s drop':' drops')+' 2 places.':'')
+' Want to keep playing? Choose <strong>+ Add Round '+(n+1)+'</strong> instead.',
confirmLabel:'End session & update ladder',cancelLabel:'Not yet',
onConfirm:()=>{
if(S.activeSession?.round!==n){toast('Session changed — not ended');render();return;}
finaliseSession();
}
});
}
function finaliseSession(){
if(!CAN_EDIT){toast('Only a team admin can finish the session');return;}
const s=S.activeSession;
if(!roundComplete(s)){toast('Score every game in Round '+s.round+' first');renderSession();return;}
s.numRounds=s.round; // sessions started before rounds were open-ended may carry a planned count
const oldRanks={};S.players.forEach(p=>oldRanks[p.id]=p.rank);

s.courts.forEach(accumulateStats);
const virtual=computeRoundVirtualRanks(s.courts,s.bands,s.rankBasis);
s.attending.forEach(id=>{const p=gp(id);if(p&&virtual[id]!==undefined)p.rank=virtual[id];});

// Skip penalty: each absentee drops 2 places (never past the bottom, never onto a lower absentee's
// place); attendees fill every remaining place in their new order, so nobody is left with a gap.
const order=[...S.players].sort((a,b)=>a.rank-b.rank);
const N=order.length;
const target={}; // old index -> new index, for absentees only
let limit=N-1;
for(let i=N-1;i>=0;i--){
if(s.skipped.includes(order[i].id)){target[i]=Math.min(i+2,limit);limit=target[i]-1;}
}
const placed=new Array(N);
Object.keys(target).forEach(i=>placed[target[i]]=order[i]);
const attendees=order.filter((p,i)=>target[i]===undefined);
let ai=0;
for(let k=0;k<N;k++)if(!placed[k])placed[k]=attendees[ai++];
placed.forEach((p,i)=>p.rank=i+1);

const rankChanges=[];
const ranksAfter={};
S.players.forEach(p=>{p.rankDelta=(oldRanks[p.id]||p.rank)-p.rank;rankChanges.push({name:p.name,delta:p.rankDelta});ranksAfter[p.id]=p.rank;});

s.rounds.push({courts:s.courts});
delete s.courts;
s.rankChanges=rankChanges;
s.ranksAfter=ranksAfter;
S.sessions.push({...s});
S.activeSession=null;
save();showTab('ladder');toast('Rankings updated! 🏆');
}

// Cancelling throws the whole session away, so it's only allowed before any score exists — in
// this round or an earlier one. Returns why cancelling is blocked, or null when it's allowed.
function cancelBlockReason(s){
if(s.rounds&&s.rounds.length)return(s.rounds.length===1?'Round 1 is':'Rounds 1–'+s.rounds.length+' are')+' already complete, so this session can\'t be cancelled — end it instead.';
const n=s.courts.reduce((sum,c)=>sum+c.games.filter(g=>g.s1!==null||g.s2!==null).length,0);
if(n)return n+' game'+(n>1?'s have':' has')+' a score. Clear '+(n>1?'them':'it')+' (tap “clear” on the game) to cancel the session.';
return null;
}
function cancelSession(){
if(!CAN_EDIT){toast('Only a team admin can cancel the session');return;}
const s=S.activeSession;if(!s)return;
if(cancelBlockReason(s)){toast('Scores are entered — session can\'t be cancelled');renderSession();return;}
confirmDialog({
title:'Cancel this session?',
body:'The <strong>'+esc(s.date)+'</strong> session ('+s.attending.length+' players, '+s.courts.length+' court'+(s.courts.length>1?'s':'')+') will be thrown away. Nothing is added to History and the ladder stays as it is.',
confirmWord:'CANCEL',confirmLabel:'Cancel session',cancelLabel:'Keep session',
onConfirm:()=>{
// a scorer may have entered a score while the dialog was open
if(!S.activeSession||cancelBlockReason(S.activeSession)){toast('Scores were entered — session not cancelled');render();return;}
S.activeSession=null;save();showTab('ladder');toast('Session cancelled');
}
});
}

async function createTeam(){

let functionError=error?.message||data?.error;
if(error?.context){try{const detail=await error.context.clone().json();functionError=detail.error||functionError;}catch(e){}}

async function saveTeamManagerChanges(teamId){
const team=adminDirectory.find(t=>t.id===teamId);if(!team)return;
const result=el('team-manager-result-'+teamId)||el('team-manager-result');
const nameInput=el('team-name-'+teamId);
const teamName=nameInput.value.trim(),originalName=nameInput.dataset.originalTeamName||'';
if(!teamName){result.style.color='var(--red)';result.textContent='Team name is required.';return;}
const changes=[];
if(teamName!==originalName)changes.push({teamId,teamName});
for(const admin of team.admins){
  const emailInput=el('team-admin-email-'+teamId+'-'+admin.userId);
  const email=emailInput.value.trim(),originalEmail=emailInput.dataset.originalEmail||'';
  const password=el('team-admin-password-'+teamId+'-'+admin.userId).value;
  if(!email){result.style.color='var(--red)';result.textContent='Each Team Admin needs an email address.';return;}
  if(password&&password.length<8){result.style.color='var(--red)';result.textContent='New passwords must contain at least 8 characters.';return;}
  if(email!==originalEmail||password)changes.push({teamId,teamAdminUserId:admin.userId,email:email===originalEmail?undefined:email,password:password||undefined});
}
if(!changes.length){result.style.color='var(--muted)';result.textContent='No changes to save.';return;}
const saveButton=document.querySelector('[data-save-team-changes="'+teamId+'"]');saveButton.disabled=true;saveButton.textContent='Saving…';
for(const change of changes){const error=await manageTeam(change);if(error){result.style.color='var(--red)';result.textContent='Could not save: '+error;saveButton.disabled=false;saveButton.textContent='Save changes';return;}}
el('team-manager-modal')?.remove();toast('Team changes saved.');await startApp();
}

const {data,error}=await SB.functions.invoke('admin-provision-user',{body:{action:'manage_team',...payload}});
let message=error?.message||data?.error;
if(error?.context){try{const detail=await error.context.clone().json();message=detail.error||message;}catch(e){}}
return message;
}

// ── History ───────────────────────────────────────────────────────────
// Has the ladder been edited since this session was finalised? (manual rank edits, players added/removed)
function ladderDriftedSince(s){
if(!s.ranksAfter)return false;
return S.players.length!==Object.keys(s.ranksAfter).length||S.players.some(p=>s.ranksAfter[p.id]!==p.rank);
}
// Undo the newest finalised session: stats, ranks and trend arrows go back to before it.
function deleteLatestSession(){
const s=S.sessions[S.sessions.length-1];
if(!s)return;
const rounds=s.rounds&&s.rounds.length?s.rounds:[{courts:s.courts}];
rounds.forEach(r=>(r.courts||[]).forEach(unaccumulateStats));
if(s.ranksAfter&&s.rankChanges){
const deltaByName={};s.rankChanges.forEach(r=>deltaByName[r.name]=r.delta);
S.players.forEach(p=>{
if(s.ranksAfter[p.id]!==undefined)p.rank=s.ranksAfter[p.id]+(deltaByName[p.name]||0);
});
[...S.players].sort((a,b)=>a.rank-b.rank).forEach((p,i)=>p.rank=i+1);
}
// Trend arrows revert to whatever the previous session showed
const prev=S.sessions[S.sessions.length-2];
const prevDelta={};
if(prev&&prev.rankChanges)prev.rankChanges.forEach(r=>prevDelta[r.name]=r.delta);
S.players.forEach(p=>p.rankDelta=prevDelta[p.name]||0);
S.sessions.pop();
save();render();toast(s.date+' session deleted');
}
function confirmDeleteLatestSession(){
const ls=S.sessions[S.sessions.length-1];if(!ls)return;
const note=!ls.ranksAfter?' This session has no saved rank snapshot, so only wins/losses/points are reverted — ranks stay as they are.'
:ladderDriftedSince(ls)?' ⚠ The ladder has changed since (ranks edited or players added/removed), so restored ranks may not be exact.'
:' Rankings go back to how they were before it.';
confirmDialog({
title:'Delete this session?',
body:'The <strong>'+esc(ls.date)+'</strong> session is removed from History and its wins, losses and points are taken off the ladder.'+note+' This cannot be undone.',
confirmWord:ls.date,confirmLabel:'Delete session',cancelLabel:'Keep session',
onConfirm:()=>{
if(S.sessions[S.sessions.length-1]!==ls){toast('History changed — nothing deleted');render();return;}
deleteLatestSession();
}
});
}

function renderHistory(){
const root=el('tab-history');
if(!S.sessions.length){root.innerHTML='<div class="empty"><div class="empty-icon">📋</div>No sessions yet.</div>';return;}
let h='';
[...S.sessions].reverse().forEach((s,idx)=>{
const roundsArr=s.rounds&&s.rounds.length?s.rounds:[{courts:s.courts}];
h+='<div class="history-card">'
+(idx===0?'<button class="btn btn-danger" id="del-latest-btn" style="float:right;padding:4px 10px;font-size:11px;">Delete</button>':'')
+'<div class="history-date">'+s.date+' · '+roundsArr.length+' round'+(roundsArr.length>1?'s':'')+' · '+roundsArr[0].courts.length+' courts · '+s.attending.length+' players</div>';
roundsArr.forEach((r,ri)=>{
if(roundsArr.length>1)h+='<div style="font-weight:700;color:var(--accent);font-size:12px;margin:8px 0 4px;">Round '+(ri+1)+'</div>';
r.courts.forEach((c,ci)=>{
if(ci>0)h+='<hr class="div">';
h+='<div style="font-size:12px;margin-bottom:5px;"><strong style="color:var(--accent)">Court '+(ci+1)+':</strong> '+c.players.map(id=>nameOf(id)).join(', ')+'</div>';
c.games.forEach((g,gi)=>{
const sc=g.s1!==null&&g.s2!==null;
h+='<div style="font-size:12px;color:var(--muted);margin-bottom:3px;">G'+(gi+1)+': '+g.pair1.map(id=>nameOf(id)).join(' & ')+' <strong style="color:var(--text)">'+(sc?g.s1:'?')+'</strong> – <strong style="color:var(--text)">'+(sc?g.s2:'?')+'</strong> '+g.pair2.map(id=>nameOf(id)).join(' & ')+(g.sitOut?' <em>(sitting: '+sitOutNames(g)+')</em>':'')+'</div>';
});
});
});
if(s.skipped&&s.skipped.length)h+='<div style="font-size:11px;color:var(--red);margin-top:6px;">Skipped: '+s.skipped.map(id=>nameOf(id)).join(', ')+'</div>';
if(s.rankChanges){
const changes=s.rankChanges.filter(r=>r.delta!==0);
if(changes.length)h+='<div style="font-size:11px;color:var(--muted);margin-top:6px;">'+changes.map(r=>r.name+' '+(r.delta>0?'▲'+r.delta:'▼'+Math.abs(r.delta))).join(' · ')+'</div>';
}
h+='</div>';
});
root.innerHTML=h;
el('del-latest-btn').addEventListener('click',confirmDeleteLatestSession);
}

if(CLOUD){
el('tab-ladder').innerHTML='<div class="empty">Loading…</div>';
SB=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
SB.auth.onAuthStateChange((ev,session)=>{

joinFromShareLink().then(startApp).then(()=>{if(linkError){toast(linkError);linkError='';}});
}else{
render();
}
